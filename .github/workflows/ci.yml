name: Verify Flow Compiler

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export dependency lockfile for one-time bootstrap
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'EXPORT_LOCKFILE:')
        run: |
          echo '__FLOW_LOCKFILE_BEGIN__'
          cat package-lock.json
          echo '__FLOW_LOCKFILE_END__'
      - name: Run backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
